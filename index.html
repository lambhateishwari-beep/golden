<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Golden Sip — Owner Panel</title><link rel="stylesheet" href="style.css"></head>
<body><button class="owner-btn" id="ownerBtn">Owner</button>
<main class="panel" id="panel" hidden><header><h1>The Golden Sip</h1><p>Owner menu management</p></header>
<section id="login"><h2>Owner login</h2><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="message"></p></section>
<section id="manager" hidden><div class="top"><h2>Menu Manager</h2><button id="logout">Logout</button></div>
<form id="categoryForm"><h3>Add category</h3><input id="categoryName" placeholder="Category name" required><button>Add category</button></form>
<form id="dishForm"><h3>Add dish</h3><input id="dishName" placeholder="Dish name" required><input id="dishDesc" placeholder="Description"><input id="dishPrice" type="number" min="0" step="0.01" placeholder="Price" required><select id="dishCategory" required></select><button>Add dish</button></form>
<h3>Current menu</h3><div id="menu"></div></section></main>
<script type="module" src="app.js"></script></body></html>
