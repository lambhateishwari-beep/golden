<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Golden Sip</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="mark">THE GOLDEN SIP</div><p>Good food. Good coffee. Good moments.</p><div class="sub">MENU</div></header>
<main>
<div id="status" class="status">Loading menu…</div>
<div id="menu" class="menu"></div>
<button id="ownerToggle" class="owner-link">Owner access</button>
<section id="loginPanel" class="panel hidden"><h2>Owner Login</h2><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button id="login">Log in</button><p id="loginMsg"></p></section>
<section id="adminPanel" class="panel hidden"><div class="adminHead"><h2>Menu Manager</h2><button id="logout" class="secondary">Log out</button></div>
<h3>Categories</h3><div class="inline"><input id="categoryName" placeholder="New category name"><button id="addCategory">Add category</button></div><div id="categoryList"></div>
<hr><h3>Add / edit dish</h3><input id="dishName" placeholder="Dish name"><input id="dishPrice" type="number" step="0.01" placeholder="Price (₹)"><input id="dishDescription" placeholder="Short description (optional)"><select id="dishCategory"></select><input id="dishImage" placeholder="Image URL (optional)"><div class="inline"><button id="saveDish">Add dish</button><button id="cancelEdit" class="secondary hidden">Cancel edit</button></div><p id="adminMsg"></p><hr><h3>Current dishes</h3><div id="dishList"></div>
</section>
</main><footer>THE GOLDEN SIP · Crafted with care</footer>
<script type="module" src="app.js"></script>
</body></html>
